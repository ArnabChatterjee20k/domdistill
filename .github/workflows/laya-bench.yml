name: laya-rerank-benchmark

# Runs the bi-encoder vs. laya-reranker head-to-head benchmark in CI so it never
# has to touch a contributor's local machine (laya pulls ~1.7 GB of weights).
# Results land in the job summary, an uploaded artifact, and a sticky PR comment.

on:
  pull_request:
    paths:
      - "domdistill/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/laya-bench.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-laya-${{ runner.os }}

      - name: Install CPU torch + project with laya extra
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install lean on GitHub-hosted runners.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[laya,benchmark,dev]"

      - name: Run rerank benchmark (embedding vs laya)
        run: |
          python benchmarks/eval_rerank.py \
            --html-file benchmarks/blog.html \
            --cases-file benchmarks/eval_cases.json \
            --penalty 0.01 \
            --engines embedding,laya \
            --markdown-out bench_rerank.md | tee bench_rerank.json

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## laya reranker vs. sentence-transformers (CPU runner)"
            echo
            cat bench_rerank.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laya-rerank-benchmark
          path: |
            bench_rerank.md
            bench_rerank.json

      - name: Post / update PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## laya reranker benchmark\n\n';
            try {
              body += fs.readFileSync('bench_rerank.md', 'utf8');
            } catch (err) {
              body += '_Benchmark did not produce output; see the job logs._';
            }
            body += `\n\n_CPU-only GitHub runner — relative comparison, not GPU latency. ([run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}))_`;
            const marker = '<!-- laya-rerank-benchmark -->';
            body += `\n${marker}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
