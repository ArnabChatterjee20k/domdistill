name: tev1-rerank-benchmark

# Benchmarks the Ollama-served tev1 decision model as a reranker against the
# default sentence-transformers bi-encoder. tev1:0.8b is ~800 MB and needs no
# torch — it runs via a local Ollama server spun up here. Results go to the job
# summary, an artifact, and a sticky PR comment.

on:
  pull_request:
    paths:
      - "domdistill/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/tev1-bench.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_HOST: "http://127.0.0.1:11434"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark,dev]"

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for the server to accept connections.
          for i in $(seq 1 30); do
            if curl -sf "$OLLAMA_HOST/api/version" >/dev/null; then
              echo "Ollama is up"; break
            fi
            sleep 2
          done

      - name: Pull tev1:0.8b
        run: ollama pull tev1:0.8b

      - name: Run rerank benchmark (embedding vs tev1)
        run: |
          python benchmarks/eval_rerank.py \
            --html-file benchmarks/blog.html \
            --cases-file benchmarks/eval_cases.json \
            --penalty 0.01 \
            --engines embedding,tev1 \
            --markdown-out bench_tev1.md | tee bench_tev1.json

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## tev1 (Ollama) reranker vs. sentence-transformers (CPU runner)"
            echo
            cat bench_tev1.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tev1-rerank-benchmark
          path: |
            bench_tev1.md
            bench_tev1.json

      - name: Post / update PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## tev1 (Ollama) reranker benchmark\n\n';
            try {
              body += fs.readFileSync('bench_tev1.md', 'utf8');
            } catch (err) {
              body += '_Benchmark did not produce output; see the job logs._';
            }
            body += `\n\n_CPU-only GitHub runner — relative comparison, not GPU latency. ([run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}))_`;
            const marker = '<!-- tev1-rerank-benchmark -->';
            body += `\n${marker}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
